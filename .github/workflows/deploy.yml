name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check JavaScript
        run: |
          node --check app.js
          node --check art.js
          node --check wallet.js
          node --check live.js
          node --check operator-core.js
          node --check operator.js
          node --check payment-core.js
          node --check pay.js
          node --test "tests/*.test.cjs"
      - uses: actions/configure-pages@v5
      - name: Prepare static files
        run: |
          mkdir -p _site
          cp index.html operator.html pay.html merchant.html start.html 404.html styles.css app.js art.js wallet.js live.js operator-core.js operator.js payment-core.js pay.js _site/
          cp -R assets _site/
          cp -R vendor _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
