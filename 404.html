<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MST 파운데이션 달란트</title><script>
(function(){var match=location.pathname.match(/^\/pay\/(0x[0-9a-f]{40})(?:\/(\d+))?\/?$/i);if(match){var target='/pay.html?to='+encodeURIComponent(match[1]);if(match[2])target+='&won='+encodeURIComponent(match[2]);var name=new URLSearchParams(location.search).get('name');if(name)target+='&name='+encodeURIComponent(name.slice(0,30));location.replace(target);}else location.replace('/');})();
</script></head><body></body></html>
