<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8f4">
  <title>운영 현황</title>
  <link rel="icon" href="assets/talent-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=20261022-1">
  <link rel="stylesheet" href="operator-gate.css?v=20261023-1">
  <link rel="stylesheet" href="dashboard.css?v=20261023-3">
  <script src="operator-gate.js?v=20261023-1" defer></script>
  <script src="wallet.js?v=20261023-2" defer></script>
  <script src="transfer-core.js?v=20261022-1" defer></script>
  <script src="payment-ui.js?v=20261022-1" defer></script>
  <script src="dashboard.js?v=20261023-3" defer></script>
</head>
<body class="operator-body" data-operator-gate>
  <main class="operator-app dashboard-app">
    <header class="operator-header">
      <a class="operator-brand" href="/" aria-label="홈으로 이동"><img src="assets/talent-mark.svg" alt=""><div><strong>운영 현황</strong><small id="dashboardUpdated">—</small></div></a>
      <button id="dashboardRefresh" class="operator-balance" type="button">새로고침</button>
    </header>
    <section id="dashboardScreen" class="operator-screen dashboard-screen" aria-live="polite">
      <p id="dashboardStatus" class="operator-alert" role="status" hidden></p>
      <div id="dashboardStats" class="dashboard-stats"></div>
      <section class="dashboard-section">
        <div class="dashboard-section-head">
          <h2>지갑</h2>
          <button id="dashboardSearchToggle" class="dashboard-search-toggle" type="button" aria-label="지갑 주소 검색" aria-expanded="false" aria-controls="dashboardSearch"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
          <input id="dashboardSearch" class="dashboard-search" type="search" placeholder="주소 검색" autocomplete="off" aria-label="지갑 주소 검색" hidden>
        </div>
        <div id="dashboardWallets" class="dashboard-wallets"></div>
      </section>
      <section class="dashboard-section">
        <h2>최근 거래</h2>
        <div id="dashboardTransfers" class="dashboard-transfers"></div>
      </section>
    </section>
    <dialog id="dashboardDialog" class="dashboard-dialog" aria-label="지갑 정보"></dialog>
  </main>
</body>
</html>
