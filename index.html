<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f4">
  <title>바자회 달란트</title>
  <link rel="icon" href="assets/talent-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="art.js" defer></script>
  <script src="wallet.js?v=20261019-2" defer></script>
  <script src="vendor/qrcode.min.js" defer></script>
  <script src="live.js?v=20261019-2" defer></script>
  <script src="app.js?v=20261019-2" defer></script>
</head>
<body>
  <div class="workspace">
    <aside class="sidebar" aria-label="미리보기 설정">
      <a class="studio-brand" href="#welcome"><img class="brand-mark" src="assets/talent-mark.svg" alt=""><span>바자회 달란트<small>UI PREVIEW</small></span></a>
      <div class="sidebar-intro"><h1>충전하고,<br>바로 사용하세요.</h1></div>
      <div class="scenario-picker"><label for="stateSelect">미리볼 화면</label><select id="stateSelect"></select></div>
      <nav id="stateNav" class="state-nav" aria-label="상태별 화면"></nav>
      <details class="test-options"><summary>다른 상황 테스트</summary><div id="extraStates"></div></details>
      <div class="sidebar-footer"><span class="green-dot"></span> 로컬 프로토타입 · 실제 거래 없음</div>
    </aside>
    <main class="canvas">
      <header class="canvas-header"><div><span class="eyebrow">COMMUNITY BAZAAR</span><h2>화면 테스트</h2></div><button id="resetButton" class="text-button" type="button">처음부터 보기 <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.34 5.66M20 5v6h-6"/></svg></button></header>
      <div class="preview-layout">
        <section class="device" aria-label="바자회 서비스 화면">
          <header class="app-header"><span class="app-brand"><img class="brand-mark small" src="assets/talent-mark.svg" alt="">바자회 달란트</span><span class="event-pill">화면 시안</span></header>
          <div id="appScreen" class="app-screen" aria-live="polite"></div>
          <footer class="app-footer">화면 시안 <span>·</span> 실제 충전·결제는 진행되지 않습니다</footer>
        </section>
        <aside class="inspector" aria-label="선택한 화면 설명">
          <div class="preview-badge"><span></span> INTERACTIVE PREVIEW</div>
          <h3 id="stateTitle"></h3><p id="stateDescription"></p>
          <div id="approvalControls" class="approval-controls" hidden>
            <p>MetaMask 동작 재현</p>
            <button id="approveDemo" class="flow-button" type="button">Confirm 누름</button>
            <button id="cancelDemo" class="flow-button" type="button">취소함</button>
            <button id="missingDemo" class="flow-button" type="button">확인 창이 뜨지 않음</button>
          </div>
          <div class="step-controls"><button id="previousState" type="button" aria-label="이전 상태"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button><span id="stateCounter"></span><button id="nextState" type="button" aria-label="다음 상태"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button></div>
          <button id="continueFlow" class="flow-button" type="button">다음 단계로 보기</button>
          <p class="inspector-footnote">실제 지갑 연동 전 시안입니다.</p>
        </aside>
      </div>
    </main>
  </div>
</body>
</html>
