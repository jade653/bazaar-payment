<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f8f4"><title>매장 QR 만들기</title><link rel="stylesheet" href="styles.css"><script src="vendor/qrcode.min.js"></script></head><body class="operator-body"><main class="operator-app"><header class="operator-header"><div class="operator-brand"><img src="assets/talent-mark.svg" alt=""><div><strong>매장 QR 만들기</strong><small>직원용</small></div></div></header><section class="operator-screen"><div class="operator-title"><span>STORE QR</span><h1>매장 지갑 주소를<br>입력해 주세요.</h1></div><div class="manual-entry"><div><input id="merchantAddress" type="text" placeholder="0x 지갑 주소"><button id="makeQr" type="button">만들기</button></div></div><p id="merchantError" class="operator-alert" hidden></p><div id="merchantQr" class="live-qr" hidden></div><p id="merchantUrl" class="live-address"></p></section></main><script>
document.getElementById('makeQr').onclick=function(){var value=document.getElementById('merchantAddress').value.trim(),error=document.getElementById('merchantError'),qr=document.getElementById('merchantQr'),url=document.getElementById('merchantUrl');if(!/^0x[0-9a-f]{40}$/i.test(value)){error.hidden=false;error.textContent='올바른 지갑 주소를 입력해 주세요.';qr.hidden=true;return;}error.hidden=true;qr.hidden=false;qr.innerHTML='';var target='https://bazaar.mustree.kr/pay/'+value;new QRCode(qr,{text:target,width:210,height:210,colorDark:'#233d35',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.M});url.innerHTML='<code>'+target+'</code>';};
</script></body></html>
