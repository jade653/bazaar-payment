<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8f4">
  <title>wMST 발행·수수료 측정</title>
  <link rel="icon" href="assets/talent-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=20261022-1">
  <link rel="stylesheet" href="operator-gate.css?v=20261023-1">
  <style>
    .setup-step{border:1px solid #e3e8df;border-radius:16px;padding:18px;margin:0 0 14px;background:#fff}
    .setup-step h2{font-size:16px;margin:0 0 10px;letter-spacing:-.04em}
    .setup-step p{font-size:12px;line-height:1.8;color:#7f8f84;margin:0 0 10px}
    .setup-step label{display:block;font-size:11px;color:#839087;margin:12px 0 6px}
    .setup-step input{width:100%;border:1px solid #dfe6dc;border-radius:11px;padding:12px;font-size:13px;color:var(--ink);background:#fff}
    .setup-step code{display:block;font-size:10px;overflow-wrap:anywhere;color:#5f6f66;margin:4px 0}
    .setup-step .operator-primary,.setup-step .operator-secondary{margin-top:14px}
    .setup-facts{display:grid;gap:8px;margin:12px 0 0;font-size:12px}
    .setup-facts div{display:flex;justify-content:space-between;gap:12px}
    .setup-facts strong{color:#456550;text-align:right;overflow-wrap:anywhere}
    .setup-table{width:100%;border-collapse:collapse;font-size:10px;margin-top:12px}
    .setup-table th,.setup-table td{padding:7px 4px;border-top:1px solid #edf0eb;text-align:right;white-space:nowrap}
    .setup-table th:first-child,.setup-table td:first-child{text-align:left;white-space:normal}
    .setup-step textarea{display:block;width:100%;min-height:170px;margin-top:8px;border:1px solid #dfe6dc;border-radius:11px;padding:10px;font-size:11px;font-family:ui-monospace,Menlo,Consolas,monospace;color:#30423a}
    .setup-progress{font-size:12px;color:#527a4b;margin-top:12px;display:flex;align-items:center;gap:8px}
    .setup-progress .operator-spinner{width:16px;height:16px;border-width:2px}
    .setup-done{font-size:12px;color:#3f7651;font-weight:700;margin-top:12px}
    .setup-note{font-size:11px;color:#966837;background:#fff4e8;border-radius:10px;padding:10px 12px;margin-top:10px;line-height:1.7}
  </style>
  <script src="operator-gate.js?v=20261026-1" defer></script>
  <script src="wallet.js?v=20261027-3" defer></script>
  <script src="transfer-core.js?v=20261027-3" defer></script>
  <script src="payment-ui.js?v=20261027-3" defer></script>
  <script src="wmst-artifact.js?v=20261022-1" defer></script>
  <script src="setup.js?v=20261022-1" defer></script>
</head>
<body class="operator-body" data-operator-gate>
  <main class="operator-app">
    <header class="operator-header">
      <a class="operator-brand" href="/" aria-label="홈으로 이동"><img src="assets/talent-mark.svg" alt=""><div><strong>wMST 발행·수수료 측정</strong><small>운영자 전용</small></div></a>
      <button id="balanceButton" class="operator-balance" type="button" hidden><span id="balanceText">— MST</span><small>잔액 새로고침</small></button>
    </header>
    <section id="setupScreen" class="operator-screen" aria-live="polite"></section>
  </main>
</body>
</html>
